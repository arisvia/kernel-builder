name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Profile'
        required: true
        type: choice
        default: 'polaris'
        options:
          - 'polaris'
          - 'custom'
      release_mode:
        description: 'Publish Mode (release: tagged Release / nightly: rolling prerelease / artifact_only: no release)'
        required: true
        type: choice
        default: 'release'
        options:
          - 'release'
          - 'nightly'
          - 'artifact_only'
      su_type:
        description: 'Superuser / Root Solution (bakasu: BakaSU / sukisu: SukiSU-Ultra / ksu_next: KernelSU-Next / ksu: KernelSU / none: Clean Kernel)'
        required: true
        type: choice
        default: 'bakasu'
        options:
          - 'bakasu'
          - 'sukisu'
          - 'ksu_next'
          - 'ksu'
          - 'none'
      enable_docker:
        description: 'Enable Docker / LXC Container Kernel Configs (~250KB)'
        required: false
        type: boolean
        default: false
      enable_debug:
        description: 'Include boot crash logger & diagnostic probe in flashable zip'
        required: false
        type: boolean
        default: false
      custom_repo:
        description: '[Custom] Kernel Git Repo URL (only if device=custom)'
        required: false
        default: ''
      custom_branch:
        description: '[Custom] Kernel Git Branch (only if device=custom)'
        required: false
        default: ''
      custom_defconfig:
        description: '[Custom] Kernel Defconfig (only if device=custom)'
        required: false
        default: ''
      custom_localversion:
        description: 'Kernel Version Suffix (LOCALVERSION, e.g. -BakaSU-polaris; empty = auto)'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '0 20 * * *'
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v7

      - name: Load Device Profile
        run: |
          EVENT_NAME="${{ github.event_name }}"
          echo "Event trigger: $EVENT_NAME"

          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "[+] Nightly schedule triggered"
            RELEASE_MODE="nightly"
            DEVICE="polaris"
            SU_TYPE="bakasu"
            ENABLE_DOCKER="false"
            ENABLE_DEBUG="false"
          else
            RELEASE_MODE="${{ github.event.inputs.release_mode }}"
            DEVICE="${{ github.event.inputs.device }}"
            SU_TYPE="${{ github.event.inputs.su_type }}"
            ENABLE_DOCKER="${{ github.event.inputs.enable_docker }}"
            ENABLE_DEBUG="${{ github.event.inputs.enable_debug }}"
          fi

          case "$SU_TYPE" in
            bakasu) SU_LABEL="BakaSU" ;;
            sukisu) SU_LABEL="SukiSU-Ultra" ;;
            ksu_next) SU_LABEL="KernelSU-Next" ;;
            ksu) SU_LABEL="KernelSU" ;;
            none) SU_LABEL="Vanilla" ;;
            *) SU_LABEL="BakaSU" ;;
          esac

          echo "RELEASE_MODE=$RELEASE_MODE" >> $GITHUB_ENV
          echo "SU_TYPE=$SU_TYPE" >> $GITHUB_ENV
          echo "SU_LABEL=$SU_LABEL" >> $GITHUB_ENV
          echo "ENABLE_DOCKER=$ENABLE_DOCKER" >> $GITHUB_ENV
          echo "ENABLE_DEBUG=${ENABLE_DEBUG:-false}" >> $GITHUB_ENV
          echo "Requested device profile: $DEVICE"
          echo "Superuser provider: $SU_LABEL ($SU_TYPE)"


          if [ "$DEVICE" != "custom" ]; then
            CONFIG_FILE="devices/${DEVICE}.env"
            if [ -f "$CONFIG_FILE" ]; then
              echo "[+] Sourcing $CONFIG_FILE"
              set -a
              source "$CONFIG_FILE"
              set +a
            else
              echo "[-] Error: Profile $CONFIG_FILE does not exist!"
              exit 1
            fi
          else
            echo "[+] Using custom manual inputs..."
            DEVICE_NAME="custom"
            DEVICE_MODEL="Custom Device"
            KERNEL_REPO="${{ github.event.inputs.custom_repo }}"
            KERNEL_BRANCH="${{ github.event.inputs.custom_branch }}"
            KERNEL_DEFCONFIG="${{ github.event.inputs.custom_defconfig }}"
            ARCH="arm64"
            KERNEL_IMAGE_NAME="Image.gz-dtb"
            KERNEL_VERSION_TYPE="4.19"
            CLANG_BRANCH="main"
            CLANG_DIR_NAME="clang-r547379"
            KSU_HOOK_METHOD="manual"
          fi

          # Export into GitHub Actions Environment
          echo "DEVICE_NAME=${DEVICE_NAME:-$DEVICE}" >> $GITHUB_ENV
          echo "DEVICE_MODEL=${DEVICE_MODEL:-$DEVICE}" >> $GITHUB_ENV
          echo "KERNEL_REPO=${KERNEL_REPO}" >> $GITHUB_ENV
          echo "KERNEL_BRANCH=${KERNEL_BRANCH}" >> $GITHUB_ENV
          echo "KERNEL_DEFCONFIG=${KERNEL_DEFCONFIG}" >> $GITHUB_ENV
          echo "ARCH=${ARCH:-arm64}" >> $GITHUB_ENV
          echo "KERNEL_IMAGE_NAME=${KERNEL_IMAGE_NAME:-Image.gz-dtb}" >> $GITHUB_ENV
          echo "KERNEL_VERSION_TYPE=${KERNEL_VERSION_TYPE:-4.19}" >> $GITHUB_ENV
          echo "CLANG_BRANCH=${CLANG_BRANCH:-main}" >> $GITHUB_ENV
          echo "CLANG_DIR_NAME=${CLANG_DIR_NAME:-clang-r547379}" >> $GITHUB_ENV
          echo "KSU_HOOK_METHOD=${KSU_HOOK_METHOD:-manual}" >> $GITHUB_ENV
          echo "CHECK_CONFIGS=${CHECK_CONFIGS:-}" >> $GITHUB_ENV

          # Determine KERNEL_LOCALVERSION
          if [ -n "${{ github.event.inputs.custom_localversion }}" ]; then
            INPUT_LV="${{ github.event.inputs.custom_localversion }}"
            [[ "$INPUT_LV" != -* ]] && INPUT_LV="-$INPUT_LV"
            FINAL_LOCALVERSION="$INPUT_LV"
          elif [ "$RELEASE_MODE" = "nightly" ]; then
            FINAL_LOCALVERSION="-BakaSU-${DEVICE_NAME}-nightly"
          else
            FINAL_LOCALVERSION="${KERNEL_LOCALVERSION:--BakaSU-${DEVICE_NAME}}"
          fi
          echo "FINAL_LOCALVERSION=$FINAL_LOCALVERSION" >> $GITHUB_ENV
          echo "[+] Final kernel version suffix: $FINAL_LOCALVERSION"

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev libncurses-dev make python3 python-is-python3 \
            device-tree-compiler zip unzip tar patch \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Cache AOSP Clang Toolchain
        id: cache-clang
        uses: actions/cache@v6
        with:
          path: toolchain/clang-repo/${{ env.CLANG_DIR_NAME }}
          key: clang-${{ env.CLANG_BRANCH }}-${{ env.CLANG_DIR_NAME }}

      - name: Setup Toolchain (AOSP Clang / LLVM)
        run: |
          mkdir -p toolchain
          if [ "${{ steps.cache-clang.outputs.cache-hit }}" = "true" ]; then
            echo "[+] Clang toolchain restored from cache."
          else
            echo "[+] Cache miss. Fetching AOSP Clang (${{ env.CLANG_BRANCH }} / ${{ env.CLANG_DIR_NAME }})..."
            if git clone -q --depth=1 --filter=blob:none --sparse --single-branch \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
              -b "${{ env.CLANG_BRANCH }}" toolchain/clang-repo 2>/dev/null; then
              git -C toolchain/clang-repo sparse-checkout set "${{ env.CLANG_DIR_NAME }}"
            else
              rm -rf toolchain/clang-repo
              git clone -q --depth=1 --single-branch \
                https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
                -b "${{ env.CLANG_BRANCH }}" toolchain/clang-repo
            fi
          fi
          CLANG_DIR="$(pwd)/toolchain/clang-repo/${{ env.CLANG_DIR_NAME }}"
          "$CLANG_DIR/bin/clang" --version

          echo "TOOLCHAIN_DIR=$(pwd)/toolchain" >> $GITHUB_ENV
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          echo "$CLANG_DIR/bin" >> $GITHUB_PATH

      - name: Setup Ccache Build Cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.DEVICE_NAME }}-${{ env.KERNEL_BRANCH }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.DEVICE_NAME }}-${{ env.KERNEL_BRANCH }}-
            ccache-${{ env.DEVICE_NAME }}-
      - name: Clone Kernel Source
        run: |
          echo "[+] Cloning ${{ env.KERNEL_REPO }} (branch: ${{ env.KERNEL_BRANCH }})..."
          git clone --depth=1 "${{ env.KERNEL_REPO }}" -b "${{ env.KERNEL_BRANCH }}" kernel-source

      - name: Integrate Superuser Driver
        if: ${{ env.SU_TYPE != 'none' }}
        run: |
          cd kernel-source
          echo "[+] Integrating Superuser provider: ${{ env.SU_LABEL }} (${{ env.SU_TYPE }})..."

          if [ "${{ env.SU_TYPE }}" = "bakasu" ]; then
            echo "[+] Installing BakaSU driver..."
            curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -
          elif [ "${{ env.SU_TYPE }}" = "sukisu" ]; then
            echo "[+] Installing SukiSU-Ultra driver (sukisu.org)..."
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -
          elif [ "${{ env.SU_TYPE }}" = "ksu_next" ]; then
            echo "[+] Installing KernelSU-Next driver..."
            curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash - next
          elif [ "${{ env.SU_TYPE }}" = "ksu" ]; then
            echo "[+] Installing official KernelSU driver..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          fi

          if [ "${{ env.KSU_HOOK_METHOD }}" = "manual" ]; then
            if grep -q "ksu_handle_execveat" fs/exec.c 2>/dev/null; then
              echo "[+] Native manual hooks already integrated in kernel source."
            elif [ -f "../patches/${{ env.KERNEL_VERSION_TYPE }}/manual-hook.patch" ]; then
              echo "[+] Applying manual hook patch..."
              patch -p1 < "../patches/${{ env.KERNEL_VERSION_TYPE }}/manual-hook.patch"
            else
              echo "[-] Warning: Manual hooks not found in fs/exec.c and no patch file present."
            fi
          fi

      - name: Build Kernel
        run: |
          cd kernel-source
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export ARCH=${{ env.ARCH }}
          export SUBARCH=${{ env.ARCH }}
          export KBUILD_BUILD_USER=kernel
          export KBUILD_BUILD_HOST=build

          # Configure and verify ccache
          export CCACHE_DIR="$HOME/.cache/ccache"
          ccache -M 2G
          echo "[+] Initial Ccache status:"
          ccache -s

          mkdir -p out

          MAKE_ARGS=(
            O=out
            ARCH="${{ env.ARCH }}"
            CC="ccache clang"
            LD="ld.lld"
            LLVM=1
            LLVM_IAS=1
            CLANG_TRIPLE="aarch64-linux-gnu-"
            CROSS_COMPILE="aarch64-linux-gnu-"
            CROSS_COMPILE_COMPAT="arm-linux-gnueabi-"
          )

          echo "[+] Generating defconfig: ${{ env.KERNEL_DEFCONFIG }}..."
          make "${MAKE_ARGS[@]}" ${{ env.KERNEL_DEFCONFIG }}

          if [ -n "${{ env.FINAL_LOCALVERSION }}" ]; then
            echo "[+] Setting CONFIG_LOCALVERSION to \"${{ env.FINAL_LOCALVERSION }}\"..."
            scripts/config --file out/.config --set-str LOCALVERSION "${{ env.FINAL_LOCALVERSION }}"
          fi

          if [ "${{ env.SU_TYPE }}" != "none" ]; then
            echo "[+] Enabling ${{ env.SU_LABEL }} in config..."
            scripts/config --file out/.config -e KSU
            if [ "${{ env.KSU_HOOK_METHOD }}" = "manual" ]; then
              scripts/config --file out/.config \
                -e KSU_MANUAL_HOOK \
                -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
                -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
                -e KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
                -d KSU_TRACEPOINT_HOOK
            else
              scripts/config --file out/.config \
                -e KSU_TRACEPOINT_HOOK \
                -d KSU_MANUAL_HOOK
            fi
          else
            echo "[+] Superuser disabled (clean non-root build)."
            scripts/config --file out/.config -d KSU
          fi

          if [ "${{ env.ENABLE_DOCKER }}" = "true" ]; then
            echo "[+] Enabling Docker / LXC Container kernel configs..."
            scripts/config --file out/.config \
              -e NAMESPACES -e UTS_NS -e IPC_NS -e USER_NS -e PID_NS -e NET_NS \
              -e SYSVIPC -e POSIX_MQUEUE \
              -e CGROUPS -e CGROUP_PIDS -e CGROUP_DEVICE -e CGROUP_FREEZER \
              -e CPUSETS -e MEMCG -e MEMCG_SWAP -e BLK_CGROUP \
              -e CGROUP_SCHED -e FAIR_GROUP_SCHED -e CFS_BANDWIDTH -e CGROUP_PERF \
              -e BRIDGE -e BRIDGE_NETFILTER -e VETH -e DUMMY \
              -e MACVLAN -e IPVLAN -e VXLAN \
              -e NETFILTER_XT_MATCH_ADDRTYPE -e NETFILTER_XT_MATCH_CGROUP \
              -e IP_VS -e IP_NF_NAT -e IP_NF_TARGET_MASQUERADE \
              -e OVERLAY_FS -e BINFMT_MISC
          fi

          make "${MAKE_ARGS[@]}" olddefconfig

          if [ -n "${{ env.CHECK_CONFIGS }}" ]; then
            echo "[+] Validating device-specific configurations (${{ env.CHECK_CONFIGS }}):"
            MISSING_CONFIGS=0
            for cfg in ${{ env.CHECK_CONFIGS }}; do
              if grep -q "^${cfg}=y" out/.config; then
                echo "  [✓] $cfg is enabled (=y)"
              else
                echo "  [✗] FATAL: $cfg is MISSING or was dropped by olddefconfig!"
                MISSING_CONFIGS=$((MISSING_CONFIGS + 1))
              fi
            done
            if [ "$MISSING_CONFIGS" -ne 0 ]; then
              echo "[-] Build aborted: $MISSING_CONFIGS required configurations are missing in .config."
              exit 1
            fi
          fi

          echo "[+] Compiling Kernel with $(nproc) cores..."
          make -j$(nproc) "${MAKE_ARGS[@]}"
          echo "[+] Checking compilation outputs..."
          TARGET_FILE="out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }}"
          if [ ! -f "$TARGET_FILE" ]; then
            if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
              TARGET_FILE="out/arch/arm64/boot/Image.gz-dtb"
            elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
              TARGET_FILE="out/arch/arm64/boot/Image.gz"
            elif [ -f "out/arch/arm64/boot/Image" ]; then
              TARGET_FILE="out/arch/arm64/boot/Image"
            else
              echo "[-] Error: Kernel binary not found in out/arch/arm64/boot/!"
              ls -la out/arch/arm64/boot/ || true
              exit 1
            fi
          fi

          echo "Target kernel file found: $TARGET_FILE"
          echo "KERNEL_OUTPUT_BIN=$(pwd)/$TARGET_FILE" >> $GITHUB_ENV

          echo "[+] Final Ccache statistics:"
          ccache -s

      - name: Package Native Baka-Flash Zip
        run: |
          mkdir -p flasher/tools flasher/META-INF/com/google/android
          cd flasher

          echo "[+] Staging modern Magisk v31.0 ARM64 magiskboot from repository..."
          if [ -f "$GITHUB_WORKSPACE/installer/tools/magiskboot" ]; then
            cp -f "$GITHUB_WORKSPACE/installer/tools/magiskboot" tools/magiskboot
          else
            curl -sSL "https://github.com/osm0sis/AnyKernel3/archive/refs/heads/arm64-tools.tar.gz" | tar -xz -C tools/ --strip-components=1 tools/magiskboot || true
          fi
          chmod 755 tools/magiskboot

          echo "[+] Copying kernel image..."
          cp "${{ env.KERNEL_OUTPUT_BIN }}" ./kernel-new

          echo "[+] Generating native 64-bit installer update-binary (Debug Probe: ${{ env.ENABLE_DEBUG }})..."
          cat > META-INF/com/google/android/update-binary << 'EOF'
          #!/system/bin/sh
          # Native Baka-Flash Engine for Android (64-bit ARM64, Zero-Bloat)
          OUTFD=$2
          ZIPFILE="$3"

          ui_print() {
            until [ -z "$1" ]; do
              echo "ui_print $1" >&$OUTFD 2>/dev/null || echo "ui_print $1" >> /proc/self/fd/$OUTFD 2>/dev/null || true
              echo "ui_print" >&$OUTFD 2>/dev/null || echo "ui_print" >> /proc/self/fd/$OUTFD 2>/dev/null || true
              shift
            done
          }

          abort() {
            ui_print "[-] ERROR: $1"
            exit 1
          }

          ui_print "==========================================="
          ui_print "  ${{ env.SU_LABEL }} Kernel Flasher for ${{ env.DEVICE_MODEL }}"
          ui_print "  Linux 4.19.325 | 64-bit ARM64 Native"
          ui_print "==========================================="

          setenforce 0 2>/dev/null
          mount -o remount,rw / 2>/dev/null
          mount -o remount,rw /tmp 2>/dev/null
          mount -o remount,exec /tmp 2>/dev/null

          WORKDIR="/tmp/kernel_flasher"
          rm -rf "$WORKDIR" 2>/dev/null
          mkdir -p "$WORKDIR"
          cd "$WORKDIR" || abort "Failed to create working directory in /tmp."

          # =========================================================
          # Diagnostic Probe (Conditionally injected when enable_debug=true)
          # =========================================================
          PROBE_ENABLED="${{ env.ENABLE_DEBUG }}"
          if [ "$PROBE_ENABLED" = "true" ]; then
            ui_print "[*] [DEBUG MODE] Probing for previous boot crash logs..."
            mount -t pstore pstore /sys/fs/pstore 2>/dev/null
            mkdir -p /cache 2>/dev/null
            for cb in /dev/block/by-name/cache /dev/block/bootdevice/by-name/cache /dev/block/platform/soc/*/by-name/cache; do
              if [ -e "$cb" ]; then
                mount -t ext4 "$cb" /cache 2>/dev/null
                break
              fi
            done
            mkdir -p /cache/debug_logs 2>/dev/null
            chmod 777 /cache/debug_logs 2>/dev/null
            OUT="/cache/debug_logs/bootlog.txt"
            rm -f "$OUT" 2>/dev/null
            if [ -d /sys/fs/pstore ]; then
              for f in /sys/fs/pstore/*; do
                if [ -f "$f" ]; then
                  echo "=== PSTORE: $(basename $f) ===" >> "$OUT"
                  cat "$f" >> "$OUT" 2>&1
                fi
              done
            fi
            if [ -f /proc/last_kmsg ]; then
              echo "=== PROC LAST_KMSG ===" >> "$OUT"
              cat /proc/last_kmsg >> "$OUT" 2>&1
            fi
            if [ -s "$OUT" ]; then
              SZ=$(ls -l "$OUT" 2>/dev/null | awk '{print $5}')
              ui_print "[!] FOUND CRASH LOG: /cache/debug_logs/bootlog.txt ($SZ bytes)"
            fi
          fi

          ui_print "[*] Extracting flasher tools and kernel..."
          unzip -o "$ZIPFILE" "tools/magiskboot" "kernel-new" -d "$WORKDIR" >/dev/null 2>&1
          if [ ! -f "$WORKDIR/tools/magiskboot" ]; then
            unzip -o "$ZIPFILE" -d "$WORKDIR" >/dev/null 2>&1
          fi
          chmod 755 "$WORKDIR/tools/magiskboot" 2>/dev/null
          [ -x "$WORKDIR/tools/magiskboot" ] || abort "Native magiskboot binary is missing or not executable."

          ui_print "[*] Locating boot partition..."
          SLOT=$(getprop ro.boot.slot_suffix 2>/dev/null)
          [ -z "$SLOT" ] && SLOT=$(grep -oE 'androidboot.slot_suffix=_[ab]' /proc/cmdline 2>/dev/null | cut -d= -f2)

          BOOT_DEV=""
          for b in "/dev/block/bootdevice/by-name/boot$SLOT" "/dev/block/by-name/boot$SLOT" "/dev/block/platform/soc/*/by-name/boot$SLOT" "/dev/block/bootdevice/by-name/boot" "/dev/block/by-name/boot"; do
            if [ -b "$b" ]; then
              BOOT_DEV="$b"
              break
            fi
          done

          [ -n "$BOOT_DEV" ] || abort "Unable to locate boot partition on device."
          ui_print "[+] Boot target: $BOOT_DEV"

          ui_print "[*] Dumping current boot image..."
          dd if="$BOOT_DEV" of=stock_boot.img bs=4096 2>/dev/null || abort "Failed to dump boot partition."

          ui_print "[*] Unpacking boot image..."
          "$WORKDIR/tools/magiskboot" unpack -h stock_boot.img >unpack.log 2>&1
          [ $? -eq 0 ] || abort "magiskboot unpack failed. Log: $(cat unpack.log)"

          ui_print "[*] Replacing kernel and stripping obsolete DTB blobs..."
          rm -f kernel_dtb dtb extra recovery_dtbo 2>/dev/null
          cp -f "$WORKDIR/kernel-new" ./kernel || abort "Failed to stage new kernel image."

          ui_print "[*] Repacking boot image..."
          "$WORKDIR/tools/magiskboot" repack stock_boot.img new_boot.img >repack.log 2>&1
          [ $? -eq 0 ] || abort "magiskboot repack failed. Log: $(cat repack.log)"
          [ -f new_boot.img ] || abort "Repacked boot image not found."

          ui_print "[*] Flashing new boot image to $BOOT_DEV..."
          dd if=new_boot.img of="$BOOT_DEV" bs=4096 2>/dev/null || abort "Failed to flash new boot image."
          sync

          ui_print "[+] Kernel flashed successfully!"
          ui_print "[+] Reboot your device to enjoy ${{ env.SU_LABEL }}!"
          ui_print "==========================================="

          cd /
          rm -rf "$WORKDIR" 2>/dev/null
          exit 0
          EOF
          sed -i 's/^          //' META-INF/com/google/android/update-binary
          chmod 755 META-INF/com/google/android/update-binary

          echo "# dummy" > META-INF/com/google/android/updater-script

          DATE_TAG=$(date +%Y%m%d_%H%M%S)
          if [ "${{ env.RELEASE_MODE }}" = "nightly" ]; then
            ZIP_NAME="${{ env.SU_LABEL }}-${{ env.DEVICE_NAME }}-nightly.zip"
          else
            ZIP_NAME="${{ env.SU_LABEL }}-${{ env.DEVICE_NAME }}-${DATE_TAG}.zip"
          fi
          echo "[+] Compressing AnyKernel3 flashable zip..."
          zip -r9 "$ZIP_NAME" * -x .git .gitignore "$ZIP_NAME"
          echo "[+] AnyKernel3 zip created: $(ls -lh "$ZIP_NAME")"

          echo "RELEASE_ZIP_PATH=$(pwd)/$ZIP_NAME" >> $GITHUB_ENV
          echo "RELEASE_ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "BUILD_DATE=$DATE_TAG" >> $GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RELEASE_ZIP_NAME }}
          path: ${{ env.RELEASE_ZIP_PATH }}

      - name: Publish Official GitHub Release
        if: env.RELEASE_MODE == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.DEVICE_NAME }}-${{ env.BUILD_DATE }}
          name: ${{ env.SU_LABEL }} Kernel for ${{ env.DEVICE_MODEL }} (${{ env.BUILD_DATE }})
          body: |
            ### ${{ env.SU_LABEL }} Kernel Build Result
            - **Device**: `${{ env.DEVICE_MODEL }} (${{ env.DEVICE_NAME }})`
            - **Kernel Source**: `${{ env.KERNEL_REPO }}`
            - **Branch**: `${{ env.KERNEL_BRANCH }}`
            - **Toolchain**: AOSP Clang `${{ env.CLANG_DIR_NAME }}`
            - **Kernel Version**: `4.19.325${{ env.FINAL_LOCALVERSION }}`
            - **Root Solution**: `${{ env.SU_LABEL }} (${{ env.SU_TYPE }})`
            
            #### 刷入方式：
            1. 下载下方的 `.zip` 刷机包。
            2. 重启手机进入 Axion / AOSP 官方 Recovery。
            3. 选择 `Apply update` -> `Apply from ADB`。
            4. 电脑运行 `adb sideload <文件名>.zip`。
          files: |
            ${{ env.RELEASE_ZIP_PATH }}
            ${{ env.KERNEL_OUTPUT_BIN }}

      - name: Publish Rolling Nightly GitHub Release
        if: env.RELEASE_MODE == 'nightly'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly-${{ env.DEVICE_NAME }}
          name: '[Nightly] ${{ env.SU_LABEL }} Kernel for ${{ env.DEVICE_MODEL }}'
          prerelease: true
          make_latest: false
          body: |
            ### [Nightly] ${{ env.SU_LABEL }} Kernel Rolling Build
            *自动滚动更新的每夜版内核，始终包含最新内核优化与 BakaSU 驱动。*
            
            - **Device**: `${{ env.DEVICE_MODEL }} (${{ env.DEVICE_NAME }})`
            - **Kernel Source**: `${{ env.KERNEL_REPO }}`
            - **Branch**: `${{ env.KERNEL_BRANCH }}`
            - **Toolchain**: AOSP Clang `${{ env.CLANG_DIR_NAME }}`
            - **Kernel Version**: `4.19.325${{ env.FINAL_LOCALVERSION }}`
            - **Build Date**: `${{ env.BUILD_DATE }}`
            
            #### 刷入方式：
            1. 下载下方的 `${{ env.RELEASE_ZIP_NAME }}` 刷机包。
            2. 重启手机进入 Axion / AOSP 官方 Recovery。
            3. 选择 `Apply update` -> `Apply from ADB`。
            4. 电脑运行 `adb sideload ${{ env.RELEASE_ZIP_NAME }}`。
          files: |
            ${{ env.RELEASE_ZIP_PATH }}
            ${{ env.KERNEL_OUTPUT_BIN }}
